{% macro brand() -%}
<svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="0.5" y="0.5" width="17" height="17" rx="1.5" stroke="currentColor" stroke-opacity="0.5"/>
  <line x1="6.5" y1="0.5" x2="6.5" y2="17.5" stroke="currentColor" stroke-opacity="0.5"/>
  <line x1="12.5" y1="0.5" x2="12.5" y2="17.5" stroke="currentColor" stroke-opacity="0.5"/>
  <line x1="0.5" y1="6" x2="17.5" y2="6" stroke="currentColor" stroke-opacity="0.5"/>
  <line x1="0.5" y1="12" x2="17.5" y2="12" stroke="currentColor" stroke-opacity="0.5"/>
  <rect x="6.5" y="6" width="6" height="6" fill="#D9A62E"/>
</svg>
SlideAI
{%- endmacro %}

{% macro tabstrip(active) -%}
{% set steps = [("A1", "Sign in"), ("B1", "Upload"), ("C1", "Theme"), ("D1", "Preview")] %}
<nav class="workbook">
  <div class="workbook__brand">{{ brand() }}</div>
  <div class="workbook__tabs">
    {% for ref, label in steps %}
      {% set i = loop.index %}
      <div class="tab {{ 'tab--active' if i == active else ('tab--done' if i < active else 'tab--todo') }}">
        <span class="tab__mark"></span>
        <span class="tab__ref">{{ ref }}</span>
        <span>{{ label }}</span>
      </div>
    {% endfor %}
  </div>
</nav>
{%- endmacro %}
